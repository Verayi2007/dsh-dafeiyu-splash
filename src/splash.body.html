<div class="dfy-bg"></div>
<div class="dfy-shaft"></div>
<div class="dfy-stars"></div>
<div class="dfy-grain"></div>

<div class="dfy-stage">
  <div class="dfy-figure">
    <div class="dfy-halo"></div>
    <div class="dfy-orbit"></div>

    <div class="dfy-camera">
      <div class="dfy-sway">
        <div class="dfy-rig">
          <img class="dfy-body" src="{{BODY}}" alt="" draggable="false">
          <div class="dfy-head"><img src="{{HEAD}}" alt="" draggable="false"></div>
        </div>
        <div class="dfy-sheen"><i></i></div>
      </div>
    </div>

    <div class="dfy-ground"></div>
    <div class="dfy-talk">嗨～</div>

    <div class="dfy-bubbles">
      <span class="dfy-bubble" style="left: 14%; bottom: 26%; --dfy-delay: 2450ms; --dfy-drift: 14px"></span>
      <span class="dfy-bubble" style="left: 26%; bottom: 16%; width: 3.5px; height: 3.5px; --dfy-delay: 2750ms; --dfy-drift: -9px"></span>
      <span class="dfy-bubble" style="left: 72%; bottom: 20%; width: 7px; height: 7px; --dfy-delay: 2600ms; --dfy-drift: 19px"></span>
      <span class="dfy-bubble" style="left: 84%; bottom: 32%; width: 3px; height: 3px; --dfy-delay: 2980ms; --dfy-drift: -12px"></span>
      <span class="dfy-bubble" style="left: 63%; bottom: 12%; width: 4.5px; height: 4.5px; --dfy-delay: 2850ms; --dfy-drift: 7px"></span>
      <span class="dfy-bubble" style="left: 20%; bottom: 38%; width: 3px; height: 3px; --dfy-delay: 3200ms; --dfy-drift: 16px"></span>
    </div>
  </div>

  <div class="dfy-word">
    <div class="dfy-title">DeepSeek</div>
    <div class="dfy-rule"></div>
    <div class="dfy-sub">深度求索</div>
  </div>
</div>

<div class="dfy-flash"></div>
<div class="dfy-dots"><i></i><i></i><i></i></div>
<div class="dfy-hint">点击任意位置继续</div>
